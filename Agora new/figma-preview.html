<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora UI - Figma Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Share Tech Mono', monospace;
      background: #f0f0f0;
      padding: 24px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .frame {
      width: 390px;
      min-height: 844px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
      flex-shrink: 0;
    }
    .frame-title {
      background: #333;
      color: #fff;
      padding: 8px 16px;
      font-size: 12px;
    }
    .content {
      max-width: 320px;
      margin: 0 auto;
      padding: 24px;
    }
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: #000;
      margin: 0 auto 12px;
      border-radius: 8px;
    }
    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .btn {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      border: none;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .btn-google {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 0 3px rgba(0,0,0,0.08), 0 2px 3px rgba(0,0,0,0.17);
      color: rgba(0,0,0,0.54);
      font-family: Roboto, sans-serif;
    }
    .btn-apple {
      background: #000;
      color: #fff;
      box-shadow: 0 0 3px rgba(0,0,0,0.08), 0 2px 3px rgba(0,0,0,0.17);
    }
    .btn-black {
      background: #000;
      color: #fff;
      font-size: 13px;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }
    .divider-line { flex: 1; height: 1px; background: #000; }
    .divider-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
    }
    .input-box {
      width: 100%;
      height: 48px;
      background: #000;
      border-radius: 10px;
      padding: 0 16px;
      color: #828282;
      font-size: 13px;
      border: none;
      margin-bottom: 12px;
    }
    .input-box::placeholder { color: #828282; }
    .back-link {
      text-align: center;
      color: #828282;
      font-size: 11px;
      margin-top: 16px;
      cursor: pointer;
    }
    /* Chat mock */
    .chat-header {
      height: 56px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .chat-messages {
      padding: 16px;
      min-height: 600px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.1);
      margin-bottom: 12px;
      font-size: 13px;
    }
    .msg-agent { margin-left: 0; background: #f9f9f9; }
    .msg-user { margin-left: auto; background: #000; color: #fff; }
    .msg-label {
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .chat-input-area {
      padding: 16px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- Landing -->
  <div class="frame">
    <div class="frame-title">1. Landing</div>
    <div class="content" style="padding-top: 80px;">
      <div class="logo-area">
        <div class="logo-box"></div>
        <div class="logo-text">AGORA</div>
      </div>
      <button class="btn btn-google">G Continue with Google</button>
      <button class="btn btn-apple"> Continue with Apple</button>
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>
      <input class="input-box" placeholder="Enter your email..." readonly>
      <button class="btn btn-black">Continue</button>
    </div>
  </div>

  <!-- Onboarding -->
  <div class="frame">
    <div class="frame-title">2. Onboarding</div>
    <div class="content" style="padding-top: 120px;">
      <div class="logo-area" style="margin-bottom: 24px;">
        <div class="logo-box"></div>
        <div class="logo-text">AGORA</div>
      </div>
      <input class="input-box" placeholder="Enter your nickname..." readonly>
      <button class="btn btn-black">Continue</button>
    </div>
  </div>

  <!-- Chat -->
  <div class="frame">
    <div class="frame-title">3. Chat</div>
    <div class="chat-header">
      <span class="logo-text" style="font-size: 18px;">AGORA</span>
      <span style="font-size: 12px;">⚙</span>
    </div>
    <div class="chat-messages">
      <div class="msg msg-agent">
        <div class="msg-label">AGENT A</div>
        Hello! How can I help you today?
      </div>
      <div class="msg msg-user">
        <div class="msg-label">YOU</div>
        I have a question about...
      </div>
      <div class="msg msg-agent">
        <div class="msg-label">AGENT B</div>
        I'd be happy to assist with that.
      </div>
    </div>
    <div class="chat-input-area">
      <input class="input-box" placeholder="Type a message..." readonly>
    </div>
  </div>
</body>
</html>
