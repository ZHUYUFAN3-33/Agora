# Agora on Fly.io — single app: SPA + Flask API, volume at /data
# Docs: https://fly.io/docs/reference/configuration/
#
# First-time setup (from repo root):
#   fly apps create <your-app-name>     # or: fly launch --no-deploy
#   # set `app` below to that name, then:
#   fly volumes create agora_data --size 3 --region nrt
#   fly secrets set OPENAI_API_KEY=sk-... AGORA_ADMIN_USER_ID=admin AGORA_ADMIN_PASSWORD='...'
#   fly deploy

app = "agora-chat"
primary_region = "nrt"

[build]

[env]
  AGORA_DATA_DIR = "/data"
  AGORA_DB_PATH = "/data/agora.db"
  AGORA_STATIC_DIR = "/app/frontend/dist"
  PORT = "8080"
  FLASK_DEBUG = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # timeout is 20s, not the usual 5s, because /api/health queues behind the same threads
  # as everything else. A synchronised login burst costs ~0.2s of CPU per participant
  # (pbkdf2, and it cannot be parallelised on one core), so 28 people arriving together
  # occupy the CPU for ~6s. Under a 5s timeout Fly reads that as an unhealthy instance,
  # pulls it from the load balancer, and every user gets 503 until the backlog drains --
  # measured at 53s of downtime. The app was serving fine throughout.
  [[http_service.checks]]
    interval = "30s"
    timeout = "20s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "agora_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
